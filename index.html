<script>
/* ─── PACE CONTROL ───────────────────────────────────────────────
   Gemini ignores "speak faster" and leaves long gaps, so pace is set
   after generation: shorten long pauses, then time-stretch (without
   changing pitch) towards a words-per-minute target.               */
const PAUSE_SHORT_MAX = 0.4;   /* longest pause kept between sentences (s) */
const PAUSE_LONG_MAX  = 0.65;  /* longest pause kept at paragraph breaks (s) */
const PAUSE_LONG_FROM = 1.0;   /* gaps longer than this are paragraph breaks (s) */
const EDGE_SILENCE    = 0.15;  /* silence kept at start and end (s) */
const SPEED_MIN = 0.9, SPEED_MAX = 1.3;

const pcm16ToFloat = bytes => {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const out  = new Float32Array(bytes.byteLength >> 1);
    for (let i = 0; i < out.length; i++) out[i] = view.getInt16(i * 2, true) / 32768;
    return out;
};

const floatToPcm16 = samples => {
    const out  = new Uint8Array(samples.length * 2);
    const view = new DataView(out.buffer);
    for (let i = 0; i < samples.length; i++)
        view.setInt16(i * 2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);
    return out;
};

/* Shorten silences: frames quieter than 6% of the loud level count as silence. */
const trimPauses = (x, sr) => {
    const hop = Math.round(sr * 0.02), frames = Math.floor(x.length / hop);
    if (frames < 10) return x;
    const rms = new Float32Array(frames);
    for (let f = 0; f < frames; f++) {
        let s = 0;
        for (let i = f * hop; i < (f + 1) * hop; i++) s += x[i] * x[i];
        rms[f] = Math.sqrt(s / hop);
    }
    const sorted = Array.from(rms).sort((a, b) => a - b);
    const thr = Math.max(sorted[Math.floor(frames * 0.95)] * 0.06, 0.0015);
    const loud = Array.from(rms, r => r > thr);
    const first = loud.indexOf(true), last = loud.lastIndexOf(true);
    if (first < 0) return x;

    const keep = [];   /* [start, end) sample ranges */
    const fade = Math.round(sr * 0.01);
    keep.push([Math.max(0, first * hop - Math.round(EDGE_SILENCE * sr)), first * hop]);
    let f = first;
    while (f <= last) {
        if (loud[f]) { const s = f; while (f <= last && loud[f]) f++; keep.push([s * hop, f * hop]); continue; }
        const s = f; while (f <= last && !loud[f]) f++;
        const gap = (f - s) * 0.02;
        const max = gap > PAUSE_LONG_FROM ? PAUSE_LONG_MAX : PAUSE_SHORT_MAX;
        const len = Math.round(Math.min(gap, max) * sr);
        /* keep half the allowed pause from each side of the gap */
        keep.push([s * hop, s * hop + (len >> 1)]);
        keep.push([f * hop - (len - (len >> 1)), f * hop]);
    }
    keep.push([(last + 1) * hop, Math.min(x.length, (last + 1) * hop + Math.round(EDGE_SILENCE * sr))]);

    const total = keep.reduce((n, [a, b]) => n + Math.max(0, b - a), 0);
    const y = new Float32Array(total);
    let o = 0;
    for (const [a, b] of keep) {
        for (let i = a; i < b; i++, o++) {
            /* short fades at each join avoid clicks */
            const g = Math.min(1, (i - a + 1) / fade, (b - i) / fade);
            y[o] = x[i] * g;
        }
    }
    return y;
};

/* WSOLA time-stretch: rate > 1 is faster, pitch unchanged. */
const timeStretch = (x, rate) => {
    if (Math.abs(rate - 1) < 0.02) return x;
    const N = 1024, Hs = N >> 1, tol = 256;
    const win = new Float32Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
    const outLen = Math.floor(x.length / rate);
    const y = new Float32Array(outLen + N), w = new Float32Array(outLen + N);
    let prev = 0;
    for (let k = 0; ; k++) {
        const outPos = k * Hs, nominal = Math.round(outPos * rate);
        if (outPos >= outLen || nominal + N + tol >= x.length) break;
        let best = nominal;
        const ref = prev + Hs;
        if (k > 0 && ref + N <= x.length) {
            let bestC = -Infinity;
            for (let d = -tol; d <= tol; d += 2) {
                const p = nominal + d;
                if (p < 0 || p + N > x.length) continue;
                let c = 0;
                for (let i = 0; i < N; i += 4) c += x[p + i] * x[ref + i];
                if (c > bestC) { bestC = c; best = p; }
            }
        }
        for (let i = 0; i < N; i++) { y[outPos + i] += x[best + i] * win[i]; w[outPos + i] += win[i]; }
        prev = best;
    }
    for (let i = 0; i < y.length; i++) if (w[i] > 1e-3) y[i] /= w[i];
    return y.subarray(0, outLen);
};

/* Trim pauses, then speed up or slow down so `words` are read at `targetWpm`.
   Returns 16-bit PCM bytes plus the pace actually reached. */
const setPace = (pcmBytes, sr, words, targetWpm) => {
    let x = trimPauses(pcm16ToFloat(pcmBytes), sr);
    const wpm  = words / (x.length / sr) * 60;
    const rate = Math.max(SPEED_MIN, Math.min(SPEED_MAX, targetWpm / wpm));
    x = timeStretch(x, rate);
    return { pcm: floatToPcm16(x), wpm: Math.round(words / (x.length / sr) * 60), rate };
};
</script>

<script type="text/babel">
/* ─── CONSTANTS ──────────────────────────────────────────────── */
const MAX_CHARS   = 1500;
const MAX_RETRIES = 5;
const PREVIEW_SCRIPT = "নমস্কার, ইশান বাংলা নিউজে আপনাকে স্বাগত। আজকের প্রধান খবর, একনজরে।";

/* ─── HELPERS ────────────────────────────────────────────────── */
const delay = ms => new Promise(r => setTimeout(r, ms));

const pcmToWav = (pcmData, sampleRate = 24000) => {
    const buf  = new ArrayBuffer(44 + pcmData.length);
    const view = new DataView(buf);
    const str  = (off, s) => [...s].forEach((c, i) => view.setUint8(off + i, c.charCodeAt(0)));
    str(0,'RIFF'); view.setUint32(4, 36+pcmData.length, true);
    str(8,'WAVE'); str(12,'fmt ');
    view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
    view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true);
    view.setUint16(32,2,true); view.setUint16(34,16,true);
    str(36,'data'); view.setUint32(40,pcmData.length,true);
    new Uint8Array(buf,44).set(pcmData);
    return buf;
};

const b64ToBytes = b64 => {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
};

/* ─── TIMESTAMPED FILENAME ───────────────────────────────────── */
const makeFilename = (category, voiceName) => {
    const now  = new Date();
    const date = now.toISOString().slice(0, 10);
    const time = now.toTimeString().slice(0, 5).replace(':', '-');
    const cat  = category.toLowerCase().replace(/[\s&]+/g, '-');
    return `${date}_${time}_${cat}_${voiceName}.wav`;
};

/* ─── PROMPT BUILDER ─────────────────────────────────────────
   Director's-notes style: who is speaking, accent, pauses, then the
   transcript. Detailed direction is what keeps Gemini from sounding
   like a flat AI narrator; the opening line stops it reading the
   notes aloud.                                                    */
const cleanScript = script => script
    .replace(/[ \t]+/g, ' ')          /* collapse stray spaces */
    .replace(/\|/g, '।')               /* keyboard "|" used as দাঁড়ি */
    .replace(/\n{3,}/g, '\n\n')        /* keep paragraph breaks, no huge gaps */
    .trim();

const countWords = script => cleanScript(script).split(/\s+/).filter(Boolean).length;

const buildPrompt = (script, segment, tone, pace, accent) => `Read the TRANSCRIPT aloud exactly as written. Do not read these notes, the headings, or anything outside the transcript.

AUDIO PROFILE: ${accent.profile}

ACCENT: ${accent.accent} Keep this accent the same from the first word to the last. Read every word exactly as written; change only pronunciation and intonation, never the words.

PAUSES: Natural and brief, like a live TV anchor. A tiny breath at commas, a short clean stop at every দাঁড়ি (।), full stop and question mark, and only a slightly longer pause between paragraphs. Never leave long silences, and never run sentences together.

DELIVERY: Sound like a real person talking to the viewer, not a machine reading text: confident, warm authority. Stress the key word in each sentence, let pitch move naturally, and let each sentence settle down at its end. Avoid a sing-song or robotic rhythm.

SEGMENT: ${segment}. Tone: ${tone}. Pace: ${pace}.

TRANSCRIPT:
${cleanScript(script)}`;

/* ─── DATA ───────────────────────────────────────────────────── */
/* wpm: target words per minute for the finished audio (pauses included).
   Raise or lower a number to make that segment faster or slower. */
const paceWords = wpm => wpm >= 160 ? 'brisk and energetic, keep the momentum'
                       : wpm >= 150 ? 'lively, normal news pace'
                       : 'measured and unhurried, but never slow';

const CATEGORIES = [
    { id:'Breaking News',             label:'Breaking News', icon:'fa-bolt',               color:'bg-red-700',    promptMod:'urgent and serious, slightly quicker but still clear and controlled', wpm:165 },
    { id:'Sports',                    label:'Sports',        icon:'fa-trophy',              color:'bg-green-600',  promptMod:'lively, with genuine excitement on key moments', wpm:165 },
    { id:'Politics',                  label:'Politics',      icon:'fa-landmark',            color:'bg-yellow-600', promptMod:'measured, neutral and authoritative', wpm:150 },
    { id:'Entertainment & Lifestyle', label:'Lifestyle',     icon:'fa-masks-theater',       color:'bg-emerald-700',promptMod:'light, friendly and conversational', wpm:155 },
    { id:'Business & Economy',        label:'Business',      icon:'fa-chart-line',          color:'bg-sky-600',    promptMod:'clear and measured, careful with numbers', wpm:150 },
    { id:'Crime & Law',               label:'Crime & Law',   icon:'fa-handcuffs',           color:'bg-amber-800',  promptMod:'grave and deliberate, slightly slower', wpm:145 },
    { id:'Community & Local News',    label:'Local News',    icon:'fa-people-group',        color:'bg-pink-600',   promptMod:'warm and friendly, like talking to neighbours', wpm:150 },
    { id:'Weather',                   label:'Weather',       icon:'fa-cloud-sun',           color:'bg-purple-700', promptMod:'calm, clear and helpful', wpm:150 },
    { id:'Education & Youth',         label:'Education',     icon:'fa-graduation-cap',      color:'bg-indigo-700', promptMod:'positive and encouraging', wpm:150 },
    { id:'Awareness',                 label:'Awareness',     icon:'fa-hand-holding-heart',  color:'bg-blue-800',   promptMod:'sincere and clear', wpm:140 },
    { id:'Social & Cultural',         label:'Culture',       icon:'fa-brush',               color:'bg-gray-800',   promptMod:'reflective and respectful', wpm:140 },
];

const ACCENTS = {
    kolkata: {
        profile: 'An experienced Bengali television news anchor from Kolkata, reading the news live on air.',
        accent:  'Natural, standard Kolkata Bengali (চলিত ভাষা) as heard on Bengali TV news: correct Bengali vowel sounds, soft consonants and the gentle rise and fall of Kolkata speech. No English or Hindi accent on Bengali words; say English names and numbers the way a Kolkata anchor naturally would.',
    },
    silchar: {
        profile: 'An experienced news anchor from Silchar in the Barak Valley of Assam, whose home language is Sylheti, reading Bengali news live on air for a Sylheti-speaking audience in Silchar and Sylhet.',
        accent:  'A strong, natural Sylheti accent, the way people from Silchar and Sylhet sound when they read Bengali. Use Sylheti sounds: প leans towards ফ (পানি sounds like ফানি), ক leans towards a throaty খ, স and শ lean towards হ at the start of words, and aspirated consonants flatten. Use the Sylheti melody: flatter and more even than Kolkata speech, with a heavier, rounder rhythm, never the musical rise and fall of Kolkata Bengali. Say English names and numbers the way a Sylheti speaker naturally would.',
    },
};

const VOICES = [
    { id:'kolkata', title:'Kolkata Accent' },
    { name:'Charon',     label:'Kolkata Male',   desc:'Clear, informative news voice', accent:'kolkata' },
    { name:'Kore',       label:'Kolkata Female', desc:'Firm, confident news voice',    accent:'kolkata' },
    { id:'silchar', title:'Silchari Accent' },
    { name:'Schedar',    label:'Silchari Male',   desc:'Even, grounded news voice',    accent:'silchar' },
    { name:'Laomedeia',  label:'Silchari Female', desc:'Warm, steady news voice',      accent:'silchar' },
];
const DEFAULT_VOICE = 'Charon';
const voiceInfo = name => VOICES.find(v => v.name === name) || VOICES.find(v => v.name === DEFAULT_VOICE);

/* ─── API ────────────────────────────────────────────────────── */
/* Newer model follows accent/pause direction better; fall back to the
   older one if the newer ID is unavailable for this key. */
const TTS_MODELS = [
    'gemini-3.1-flash-tts-preview',
    'gemini-2.5-flash-preview-tts',
];

const callTTSModel = async (apiKey, voiceName, text, model) => {
    const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
        {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                contents:[{parts:[{text}]}],
                generationConfig:{
                    responseModalities:['AUDIO'],
                    speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName}}}
                }
            })
        }
    );
    const data = await res.json();
    if (!res.ok) {
        const msg = data.error?.message || `HTTP ${res.status}`;
        if (res.status===429 || msg.includes('quota')) throw new Error('QUOTA:'+msg);
        if (res.status===404 || msg.toLowerCase().includes('not found')) throw new Error('MODEL_NOT_FOUND:'+msg);
        throw new Error(msg);
    }
    const candidate    = data.candidates?.[0];
    const finishReason = candidate?.finishReason;
    const inline       = candidate?.content?.parts?.[0]?.inlineData;
    if (!inline) {
        if (finishReason==='SAFETY')     throw new Error('Blocked by safety filter. Try rephrasing.');
        if (finishReason==='RECITATION') throw new Error('Blocked: matched copyrighted content.');
        const txt = candidate?.content?.parts?.[0]?.text || '';
        throw new Error(`No audio (reason: ${finishReason||'unknown'})${txt?' — '+txt.slice(0,100):''}`);
    }
    const rate = Number((inline.mimeType||'').match(/rate=(\d+)/)?.[1]) || 24000;
    return { pcm: b64ToBytes(inline.data), rate };
};

/* Remember which model worked so later calls skip unavailable ones */
let firstModel = 0;

const callTTS = async (apiKey, voiceName, text) => {
    let lastErr;
    for (let i = firstModel; i < TTS_MODELS.length; i++) {
        try { const audio = await callTTSModel(apiKey, voiceName, text, TTS_MODELS[i]); firstModel = i; return audio; }
        catch (err) {
            if (err.message.startsWith('MODEL_NOT_FOUND:')) { lastErr=err; continue; }
            throw err;
        }
    }
    throw new Error('No working TTS model. '+(lastErr?.message||''));
};

/* ─── AUTH ───────────────────────────────────────────────────── */
const SESSION_KEY = 'ibStudioSession';
const checkCreds  = (u, p) => u==='Ishanbangla' && p==='Ishanbangla@2022';

/* ─── LOGIN SCREEN ───────────────────────────────────────────── */
const LoginScreen = ({ onSuccess }) => {

    const [password, setPassword] = React.useState('');

    const triggerShake = msg => {

    };

    const handleLogin = e => {
        e.preventDefault(); setLoading(true);

        }, 400);
    };

    const iStyle = (base={}) => ({ width:'100%', background:'#0d111c', border:'1px solid #334155', borderRadius:'0.6rem', color:'#f1f5f9', fontSize:'0.95rem', outline:'none', boxSizing:'border-box', ...base });

    return (
        <div className="login-screen">
            <div style={{marginBottom:'1.75rem'}}><IshanBanglaLogo size="md" /></div>
            <div style={{width:'100%',maxWidth:'400px',background:'#1f2937',borderRadius:'1.25rem',border:'1px solid #334155',overflow:'hidden',boxShadow:'0 25px 60px rgba(0,0,0,.5)'}}>
                <div style={{background:'#0b0e16',padding:'1.1rem 1.5rem',borderBottom:'1px solid #334155',display:'flex',alignItems:'center',gap:'0.75rem'}}>
                    <div style={{width:34,height:34,background:'#ef4444',borderRadius:'0.55rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <i className="fa-solid fa-lock" style={{color:'white',fontSize:'0.8rem'}}/>
                    </div>
                    <div>
                        <p style={{color:'#f8fafc',fontWeight:700,fontSize:'0.95rem',lineHeight:1.2}}>Studio Access</p>
                        <p style={{color:'#64748b',fontSize:'0.68rem',letterSpacing:'0.08em',textTransform:'uppercase'}}>Authorised Personnel Only</p>
                    </div>
                </div>
                <form onSubmit={handleLogin} style={{padding:'1.5rem',display:'flex',flexDirection:'column',gap:'1rem'}}>
                    <div>
                        <label style={{display:'block',fontSize:'0.68rem',fontWeight:700,color:'#ef4444',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:'0.35rem'}}>Username</label>
                        <div style={{position:'relative'}}>

                            </button>
                        </div>
                    </div>
                    {error && (
                        <div className={shake?'shake':''} style={{background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.4)',borderRadius:'0.5rem',padding:'0.55rem 0.85rem',color:'#f87171',fontSize:'0.8rem',display:'flex',alignItems:'center',gap:'0.5rem'}}>
                            <i className="fa-solid fa-triangle-exclamation"/>{error}
                        </div>
                    )}
                    <button type="submit" disabled={loading||!username||!password}
                        style={{marginTop:'0.15rem',width:'100%',padding:'0.85rem',background:(loading||!username||!password)?'#374151':'#dc2626',color:(loading||!username||!password)?'#6b7280':'white',border:'none',borderRadius:'0.75rem',fontSize:'0.95rem',fontWeight:700,cursor:(loading||!username||!password)?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',transition:'background .2s'}}>
                        {loading?<><i className="fa-solid fa-circle-notch fa-spin"/> Verifying…</>:<><i className="fa-solid fa-right-to-bracket"/> Sign In</>}
                    </button>
                </form>
            </div>
            <p style={{color:'#334155',fontSize:'0.65rem',marginTop:'1.5rem',letterSpacing:'0.05em'}}>
                ISHAN BANGLA BROADCAST SUITE · INTERNAL USE ONLY
            </p>
        </div>
    );
};

/* ─── CATEGORY SELECTOR ──────────────────────────────────────── */
const CategorySelector = React.memo(({ category, onChange, isDark, bgControlHover }) => (
    <div className="grid grid-cols-2 gap-2 max-h-64 lg:max-h-80 overflow-y-auto pr-1">
        {CATEGORIES.map(cat => {
            const sel = category === cat.id;
            return (
                <button key={cat.id} onClick={()=>onChange(cat.id)}
                    className={`touch-target p-2 lg:p-3 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 shadow-md
                        ${sel
                            ? `${cat.color} border-2 border-white text-white shadow-xl neon-button`
                            : `${isDark?'bg-[#293547] border border-[#2e3a4e] text-slate-300':'bg-slate-100 border border-slate-300 text-slate-700'} ${bgControlHover}`
                        }`}>
                    <i className={`fa-solid ${cat.icon} text-base shrink-0`}></i>
                    <span className="leading-tight">{cat.label}</span>
                </button>
            );
        })}
    </div>
));

/* ─── VOICE SELECTOR ─────────────────────────────────────────── */
const VoiceSelector = React.memo(({ voice, onChange, onPreview, previewingVoice, isDark, textPrimary, textMuted }) => (
    <div className="space-y-1.5">
        {VOICES.map((v, i) => {
            if (v.title) return (
                <div key={i} className={`text-[9px] font-bold ${isDark?'text-slate-500':'text-slate-400'} uppercase pt-3 pb-0.5 tracking-widest`}>{v.title}</div>
            );
            const isLoading = previewingVoice === v.name;
            return (
                <div key={v.name} onClick={()=>onChange(v.name)}
                    className={`w-full p-2.5 rounded-lg border transition-all flex items-center justify-between cursor-pointer touch-target
                        ${voice===v.name
                            ?'bg-red-500/10 border-red-600 ring-1 ring-red-600'
                            :isDark?'bg-[#242c38] border-slate-800 hover:border-slate-700 hover:bg-[#2e3644]':'bg-slate-50 border-slate-200 hover:bg-slate-100'
                        }`}>
                    <div className="flex-1 min-w-0">
                        <div className={`text-xs font-semibold truncate ${voice===v.name?'text-red-400':textPrimary}`}>{v.label}</div>
                        <div className={`text-[10px] ${textMuted} mt-0.5 truncate`}>{v.desc}</div>
                    </div>
                    <button onClick={e=>{e.stopPropagation();onPreview(v.name);}} disabled={isLoading}
                        className={`ml-2 px-2.5 py-1 text-[10px] font-medium rounded-full flex items-center gap-1 shrink-0 transition-colors
                            ${isLoading?'bg-red-800 text-white cursor-not-allowed':'bg-red-600 text-white hover:bg-red-500 neon-button'}`}>
                        {isLoading
                            ? <><i className="fa-solid fa-spinner fa-spin"></i></>
                            : <><i className="fa-solid fa-volume-high"></i> {voice===v.name?'✓':'Try'}</>}
                    </button>
                </div>
            );
        })}
    </div>
));

/* ─── SETTINGS MODAL ─────────────────────────────────────────── */
const SettingsModal = React.memo(({ apiKey, setApiKey, theme, setTheme, onClose, onLogout, isDark, bgCard, textHeader, textMuted, bgInput, borderSubtle }) => (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4 animate-fade-in">
        <div className={`${bgCard} rounded-t-2xl sm:rounded-2xl border ${borderSubtle} w-full sm:max-w-md shadow-2xl overflow-hidden`}>
            <div className={`p-5 border-b ${borderSubtle} flex justify-between items-center ${isDark?'bg-[#11141f]':'bg-slate-50'}`}>
                <h2 className={`text-lg font-bold ${textHeader}`}>Studio Settings</h2>
                <button onClick={onClose} className={`${textMuted} hover:text-red-400 transition-colors p-1`}>
                    <i className="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div className="p-5 space-y-5 max-h-[70vh] overflow-y-auto">
                {/* Theme */}
                <div>
                    <label className="block text-xs font-bold text-red-500 uppercase tracking-widest mb-2">Theme</label>
                    <div className="flex gap-3">
                        {['dark','light'].map(t=>(
                            <button key={t} onClick={()=>{setTheme(t);localStorage.setItem('appTheme',t);}}
                                className={`flex-1 touch-target flex items-center justify-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-all border
                                    ${theme===t?'bg-red-600 border-red-500 text-white':isDark?'text-slate-400 border-slate-700 hover:bg-slate-800':'text-slate-600 bg-slate-100 border-slate-200 hover:bg-slate-200'}`}>
                                <i className={`fa-solid ${t==='dark'?'fa-moon':'fa-sun'}`}/> {t.charAt(0).toUpperCase()+t.slice(1)}
                            </button>
                        ))}
                    </div>
                </div>
                {/* API Key */}
                <div>
                    <label className="block text-xs font-bold text-red-500 uppercase tracking-widest mb-2">Gemini API Key</label>
                    <div className="relative">
                        <i className={`fa-solid fa-key absolute left-3 top-3.5 ${textMuted}`}></i>
                        <input type="password"
                            className={`w-full rounded-lg py-3 pl-10 pr-4 text-sm focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition-all ${bgInput}`}
                            placeholder="Paste key starting with AIza..."
                            value={apiKey}
                            onChange={e=>{const k=e.target.value;setApiKey(k);localStorage.setItem('geminiApiKey',k);}}/>
                    </div>
                    <div className={`mt-2 flex items-start gap-2 p-2 rounded-lg text-xs ${isDark?'bg-yellow-900/20 border border-yellow-700/40 text-yellow-400':'bg-yellow-50 border border-yellow-300 text-yellow-700'}`}>
                        <i className="fa-solid fa-triangle-exclamation mt-0.5 shrink-0"></i>
                        <span>Stored in browser localStorage. Don't use on shared devices.</span>
                    </div>
                    <div className={`text-xs ${textMuted} mt-3 p-3 space-y-1 ${isDark?'bg-[#11141f] border border-slate-800':'bg-slate-50 border border-slate-200'} rounded-lg`}>
                        <p className="font-semibold text-red-400">How to get your key:</p>
                        <ol className="list-decimal list-inside ml-2 space-y-0.5">
                            <li>Go to <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-red-400 hover:underline">Google AI Studio</a>.</li>
                            <li>Click <strong>Create API key</strong> and copy it.</li>
                            <li>Paste above and Save.</li>
                        </ol>
                    </div>
                </div>
            </div>
            <div className={`p-4 ${isDark?'bg-[#11141f]':'bg-slate-50'} flex items-center justify-between`}>
                <button onClick={onLogout}
                    className={`touch-target flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${isDark?'text-slate-400 hover:text-red-400 hover:bg-slate-800':'text-slate-500 hover:text-red-500 hover:bg-slate-100'}`}>
                    <i className="fa-solid fa-right-from-bracket text-xs"/> Log Out
                </button>
                <button onClick={onClose} className="touch-target px-6 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-500 transition-colors neon-button">
                    Save & Close
                </button>
            </div>
        </div>
    </div>
));

/* ─── LOGIN GATE ─────────────────────────────────────────────── */
const App = () => {
    const [authed, setAuthed] = React.useState(()=>!!sessionStorage.getItem(SESSION_KEY));
    if (!authed) return <LoginScreen onSuccess={()=>setAuthed(true)} />;
    return <Studio onLogout={()=>{sessionStorage.removeItem(SESSION_KEY);setAuthed(false);}} />;
};

/* ─── MAIN STUDIO ────────────────────────────────────────────── */
const Studio = ({ onLogout }) => {
    const [apiKey,    setApiKey]    = React.useState(()=>localStorage.getItem('geminiApiKey')||'');
    const [script,    setScript]    = React.useState('');
    const [category,  setCategory]  = React.useState(()=>localStorage.getItem('defaultCategory')||'Breaking News');
    /* Saved voice may be one of the old voices that were removed */
    const [voice,     setVoice]     = React.useState(()=>voiceInfo(localStorage.getItem('defaultVoice')).name);
    const [theme,     setTheme]     = React.useState(()=>localStorage.getItem('appTheme')||'dark');
    const [loading,   setLoading]   = React.useState(false);
    const [retryInfo, setRetryInfo] = React.useState('');
    const [audioSrc,  setAudioSrc]  = React.useState(null);
    const [audioFile, setAudioFile] = React.useState('');
    const [audioWpm,  setAudioWpm]  = React.useState(0);
    const [error,     setError]     = React.useState('');
    const [showSettings, setShowSettings] = React.useState(false);
    const [previewingVoice, setPreviewingVoice] = React.useState(null);
    const prevAudioRef = React.useRef(null);

    const isDark         = theme==='dark';
    const bgCard         = isDark?'bg-[#1f2937] border-slate-800':'bg-white border-slate-200 shadow-lg';
    const textHeader     = isDark?'text-white':'text-slate-900';
    const textPrimary    = isDark?'text-slate-100':'text-slate-800';
    const textMuted      = isDark?'text-slate-400':'text-slate-500';
    const bgInput        = isDark?'bg-[#11141f] border-slate-800 text-white placeholder:text-slate-600':'bg-slate-50 border-slate-300 text-slate-900 placeholder:text-slate-400';
    const borderSubtle   = isDark?'border-slate-700':'border-slate-300';
    const bgNav          = isDark?'header-bg-dark border-slate-800':'header-bg-light border-slate-200';
    const bgControlHover = isDark?'hover:bg-[#323f53]':'hover:bg-slate-200';

    const handleCategoryChange = React.useCallback(v=>{setCategory(v);localStorage.setItem('defaultCategory',v);},[]);
    const handleVoiceChange    = React.useCallback(v=>{setVoice(v);localStorage.setItem('defaultVoice',v);},[]);

    const setAudio = (url, filename='') => {
        if (prevAudioRef.current) URL.revokeObjectURL(prevAudioRef.current);
        prevAudioRef.current = url;
        setAudioSrc(url);
        setAudioFile(filename);
    };

    const generateVoicePreview = async name => {
        if (!apiKey){setShowSettings(true);setError('Add your API key in Settings first.');return;}
        setPreviewingVoice(name);
        try {
            /* Same direction as real output, so the preview sounds like the result */
            const previewPrompt = buildPrompt(PREVIEW_SCRIPT, 'Introduction', 'warm and welcoming', paceWords(150), ACCENTS[voiceInfo(name).accent]);
            const raw   = await callTTS(apiKey, name, previewPrompt);
            const paced = setPace(raw.pcm, raw.rate, countWords(PREVIEW_SCRIPT), 150);
            const url   = URL.createObjectURL(new Blob([pcmToWav(paced.pcm, raw.rate)], {type:'audio/wav'}));
            const audio = new Audio(url);
            audio.onended=()=>{URL.revokeObjectURL(url);setPreviewingVoice(null);};
            audio.play().catch(()=>setPreviewingVoice(null));
        } catch(err){ setError('Preview failed: '+err.message); }
        finally { setPreviewingVoice(null); }
    };

    const generateVoiceover = async () => {
        if (!apiKey){setShowSettings(true);setError('Add your API key in Settings first.');return;}
        if (!script.trim()){setError('Please enter a script.');return;}
        if (script.length>MAX_CHARS){setError(`Script too long. Max ${MAX_CHARS} chars.`);return;}

        setLoading(true); setError(''); setRetryInfo(''); setAudio(null);

        const cat    = CATEGORIES.find(c=>c.id===category);
        const prompt = buildPrompt(script, category, cat.promptMod, paceWords(cat.wpm), ACCENTS[voiceInfo(voice).accent]);

        try {
            for (let attempt=0; attempt<MAX_RETRIES; attempt++) {
                try {
                    const raw      = await callTTS(apiKey, voice, prompt);
                    const paced    = setPace(raw.pcm, raw.rate, countWords(script), cat.wpm);
                    const url      = URL.createObjectURL(new Blob([pcmToWav(paced.pcm, raw.rate)], {type:'audio/wav'}));
                    setAudioWpm(paced.wpm);
                    const filename = makeFilename(category, voiceInfo(voice).label.replace(/\s+/g,'-'));
                    setAudio(url, filename);
                    return;
                } catch(err) {
                    if (err.message.startsWith('QUOTA:') || attempt===MAX_RETRIES-1) {
                        setError(err.message.replace('QUOTA:',''));
                        return;
                    }
                    const wait = Math.pow(2,attempt)*1000;
                    setRetryInfo(`Attempt ${attempt+1}/${MAX_RETRIES} failed — retrying in ${wait/1000}s…`);
                    await delay(wait);
                }
            }
        } finally {
            /* Always release the button, whatever happened */
            setLoading(false);
            setRetryInfo('');
        }
    };

    React.useEffect(()=>{
        const h = e => { if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!loading) generateVoiceover(); };
        window.addEventListener('keydown',h);
        return ()=>window.removeEventListener('keydown',h);
    },[script,voice,category,apiKey,loading]);

    React.useEffect(()=>()=>{if(prevAudioRef.current)URL.revokeObjectURL(prevAudioRef.current);},[]);

    const canGenerate = !loading && script.trim().length>0 && script.length<=MAX_CHARS && !!apiKey;

    return (
        <div className={`min-h-screen font-sans selection:bg-red-500 selection:text-white ${isDark?'dark-theme':'light-theme'}`}>

            {/* ── NAV ── */}
            <nav className={`${bgNav} border-b sticky top-0 z-20 transition-colors`}>
                <div className="max-w-7xl mx-auto px-4 lg:px-6 h-16 lg:h-20 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        {/* Mobile: xs logo only. Desktop: sm logo + title */}
                        <div className="lg:hidden">
                            <IshanBanglaLogo size="xs" />
                        </div>
                        <div className="hidden lg:block">
                            <IshanBanglaLogo size="sm" />
                        </div>
                        <div className={`hidden sm:block h-8 w-px ${isDark?'bg-slate-700':'bg-slate-300'}`}/>
                        <div className="hidden sm:block">
                            <h1 className={`font-extrabold text-lg lg:text-2xl leading-snug tracking-tight ${textHeader}`}>AI News Studio</h1>
                            <p className={`text-[10px] lg:text-xs ${textMuted} font-medium uppercase tracking-[0.15em]`}>Broadcast Voice Suite</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <button onClick={onLogout}
                            className={`h-10 w-10 rounded-full flex items-center justify-center transition-all ${isDark?'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-red-400':'bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-red-500'}`}
                            title="Log Out">
                            <i className="fa-solid fa-right-from-bracket text-sm"></i>
                        </button>
                        <button onClick={()=>setShowSettings(true)}
                            className={`h-10 w-10 rounded-full flex items-center justify-center transition-all
                                ${apiKey?(isDark?'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white':'bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800'):'bg-red-500/10 text-red-500 ring-2 ring-red-500 animate-pulse'}`}
                            title="Settings">
                            <i className="fa-solid fa-gear"></i>
                        </button>
                    </div>
                </div>
            </nav>

            {/* ── MAIN ── */}
            {/* Mobile: script first (order-1), controls second (order-2).
                Desktop: controls left (lg:order-1), script right (lg:order-2). */}
            <main className="max-w-7xl mx-auto px-4 lg:px-6 py-4 lg:py-6 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-8">

                {/* ── RIGHT / SCRIPT PANEL (first on mobile) ── */}
                <div className="order-1 lg:order-2 lg:col-span-8 flex flex-col gap-4 lg:gap-6">

                    {/* Script editor */}
                    <div className={`${bgCard} rounded-2xl border ${borderSubtle} shadow-xl overflow-hidden flex flex-col`}>
                        <div className={`${isDark?'bg-[#11141f]':'bg-slate-50'} px-4 py-2.5 border-b ${borderSubtle} flex justify-between items-center`}>
                            <span className={`text-xs font-bold ${textMuted} uppercase tracking-wider`}>Script</span>
                            <div className="flex items-center gap-3">
                                {/* Hide Ctrl+Enter hint on mobile — no physical keyboard */}
                                <span className={`hidden sm:flex items-center gap-1 text-xs ${textMuted}`}>
                                    <kbd className={`px-1.5 py-0.5 rounded text-[10px] font-mono ${isDark?'bg-slate-700 text-slate-400':'bg-slate-200 text-slate-500'}`}>Ctrl</kbd>
                                    +
                                    <kbd className={`px-1.5 py-0.5 rounded text-[10px] font-mono ${isDark?'bg-slate-700 text-slate-400':'bg-slate-200 text-slate-500'}`}>↵</kbd>
                                </span>
                                <span className={`text-xs font-medium ${script.length>MAX_CHARS?'text-red-400':textMuted}`}>
                                    {script.length}/{MAX_CHARS}
                                </span>
                            </div>
                        </div>
                        <textarea
                            className={`w-full bg-transparent p-4 lg:p-6 outline-none resize-none text-base lg:text-xl leading-relaxed bengali-text ${textPrimary} ${isDark?'placeholder:text-slate-600':'placeholder:text-slate-400'}`}
                            style={{minHeight:'314px'}}
                            placeholder="Enter your news script here (Bengali or English)…"
                            value={script}
                            onChange={e=>{if(e.target.value.length<=MAX_CHARS)setScript(e.target.value);}}
                        />
                    </div>

                    {/* Error */}
                    {error && (
                        <div className="bg-red-500/10 border border-red-700 text-red-400 px-4 py-3 rounded-xl text-sm flex items-center gap-3 animate-fade-in">
                            <i className="fa-solid fa-triangle-exclamation shrink-0"></i>
                            <span className="font-semibold">{error}</span>
                        </div>
                    )}

                    {/* Retry info */}
                    {retryInfo && (
                        <div className={`px-4 py-3 rounded-xl text-sm flex items-center gap-3 animate-fade-in border ${isDark?'bg-yellow-900/20 border-yellow-700/40 text-yellow-400':'bg-yellow-50 border-yellow-300 text-yellow-700'}`}>
                            <i className="fa-solid fa-rotate fa-spin shrink-0"></i>
                            <span>{retryInfo}</span>
                        </div>
                    )}

                    {/* Action card */}
                    <div className={`${bgCard} rounded-2xl border ${borderSubtle} p-4 lg:p-6 shadow-xl`}>
                        {!audioSrc && (
                            <button onClick={generateVoiceover} disabled={!canGenerate}
                                className={`touch-target w-full py-3.5 lg:py-4 rounded-xl font-bold text-base lg:text-lg shadow-xl transition-all flex items-center justify-center gap-3
                                    ${canGenerate?'bg-red-700 hover:bg-red-600 text-white neon-button':`${isDark?'bg-slate-700 text-slate-400':'bg-slate-300 text-slate-500'} cursor-not-allowed`}`}>
                                {loading
                                    ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Broadcasting…</>
                                    : <><i className="fa-solid fa-bullhorn"></i> Generate Voiceover</>}
                            </button>
                        )}

                        {/* Voice selector */}
                        <div className={`mt-4 lg:mt-5 pt-4 border-t ${borderSubtle}`}>
                            <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest mb-3">VOICE TALENT</h3>
                            <VoiceSelector
                                voice={voice} onChange={handleVoiceChange}
                                onPreview={generateVoicePreview} previewingVoice={previewingVoice}
                                isDark={isDark} textPrimary={textPrimary} textMuted={textMuted} />
                        </div>

                        {/* Audio player */}
                        {audioSrc && (
                            <div className="animate-fade-in mt-5 pt-5 border-t border-slate-700">
                                <div className={`flex items-center justify-between mb-4`}>
                                    <div className="flex items-center gap-3">
                                        <div className="h-10 w-10 bg-green-500/10 rounded-full flex items-center justify-center border border-green-700 text-green-500 shrink-0">
                                            <i className="fa-solid fa-check"></i>
                                        </div>
                                        <div>
                                            <p className={`font-bold ${textPrimary} text-base`}>Broadcast Ready</p>
                                            <p className={`text-xs ${textMuted}`}>{voiceInfo(voice).label} · {CATEGORIES.find(c=>c.id===category)?.label} · {audioWpm} words/min</p>
                                        </div>
                                    </div>
                                    <div className="bar-container">
                                        <div className="bar"/><div className="bar"/><div className="bar"/>
                                        <div className="bar"/><div className="bar"/>
                                    </div>
                                </div>
                                <audio controls src={audioSrc} className="w-full h-10 mb-4 rounded-lg" autoPlay></audio>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={()=>{setAudio(null);setRetryInfo('');}}
                                        className={`touch-target py-3 rounded-xl text-sm font-semibold ${isDark?'bg-slate-700 text-slate-300 hover:bg-slate-600':'bg-slate-200 text-slate-700 hover:bg-slate-300'} transition-colors`}>
                                        <i className="fa-solid fa-file-circle-plus mr-1.5"></i>New Script
                                    </button>
                                    <a href={audioSrc} download={audioFile}
                                        className="touch-target flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-semibold bg-red-600 text-white hover:bg-red-500 transition-colors neon-button">
                                        <i className="fa-solid fa-download"></i>Download WAV
                                    </a>
                                </div>
                                <p className={`text-[10px] ${textMuted} mt-2 text-center truncate`}>{audioFile}</p>
                            </div>
                        )}
                    </div>
                </div>

                {/* ── LEFT / CONTROLS PANEL (second on mobile) ── */}
                <div className="order-2 lg:order-1 lg:col-span-4 flex flex-col gap-4 lg:gap-6 lg:space-y-0">

                    {/* Segment selector */}
                    <div className={`${bgCard} p-4 lg:p-5 rounded-2xl shadow-xl border ${borderSubtle}`}>
                        <h3 className="text-xs font-bold text-red-500 uppercase tracking-widest mb-3">SEGMENT TYPE</h3>
                        <CategorySelector category={category} onChange={handleCategoryChange} isDark={isDark} bgControlHover={bgControlHover} />
                    </div>
                </div>
            </main>

            {showSettings && (
                <SettingsModal
                    apiKey={apiKey} setApiKey={setApiKey}
                    theme={theme} setTheme={setTheme}
                    onClose={()=>setShowSettings(false)}
                    onLogout={()=>{setShowSettings(false);onLogout();}}
                    isDark={isDark} bgCard={bgCard} textHeader={textHeader}
                    textMuted={textMuted} bgInput={bgInput} borderSubtle={borderSubtle} />
            )}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
